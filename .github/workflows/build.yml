name: Build ESP32

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32
            idf: v5.1.4
          - target: esp32s3
            idf: v5.1.4

    env:
      IDF_VERSION: ${{ matrix.idf }}
      IDF_TARGET: ${{ matrix.target }}
      # Cache key based only on version -> reused for every commit.
      IDF_PATH: /opt/esp/idf

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------
      # 1) ESP-IDF toolchain (~4.1 GB uncompressed) - the slowest part.
      #    Key is SHARED between matrix targets on purpose: install.sh
      #    installs one toolchain for both, so keying per target would
      #    store two identical 4 GB copies and blow the 10 GB repo quota,
      #    which evicts this most valuable cache first.
      #    Key has no commit hash, so this hits on every run.
      # ---------------------------------------------------------------
      - name: Cache ESP-IDF toolchain
        uses: actions/cache@v4
        with:
          path: |
            /opt/esp/idf
            ~/.espressif
          key: idf-${{ matrix.idf }}-toolchain-${{ runner.os }}
          restore-keys: |
            idf-${{ matrix.idf }}-toolchain-

      # ---------------------------------------------------------------
      # 2) ccache - separate from build/ because it is keyed by target
      #    (esp32 and esp32s3 objects are not interchangeable) but has
      #    no per-commit granularity worth the storage.
      # ---------------------------------------------------------------
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.target }}-${{ runner.os }}

      # ---------------------------------------------------------------
      # 3) Incremental build dir. Cached only when the source hash is new
      #    (save-cache), always restored from the newest previous build.
      #    Re-uploading on every commit would fill the quota quickly.
      # ---------------------------------------------------------------
      - name: Cache build artifacts (incremental compile)
        uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: build
          key: build-${{ matrix.target }}-${{ hashFiles('**/CMakeLists.txt', '**/*.c', '**/*.h', '**/*.cpp', 'sdkconfig.defaults', 'partitions.csv', 'main/idf_component.yml') }}
          restore-keys: |
            build-${{ matrix.target }}-

      # cache/restore exposes cache-matched-key (not cache-hit).
      # Non-empty means an existing build dir was restored.
      - name: Record build dir restore state
        id: build-state
        run: echo "restored=true" >> $GITHUB_OUTPUT && [ -n "${{ steps.build-cache.outputs.cache-matched-key }}" ] || echo "restored=false" >> $GITHUB_OUTPUT

      - name: Configure ccache
        run: |
          # ubuntu-latest ships ccache, but install it if missing so the
          # CMakeLists find_program() always finds it (otherwise the whole
          # ccache tier silently degrades to a full rebuild).
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          fi
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=300M" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          # Loosen time/ctime checks: GitHub runners have fresh clocks and
          # restored files, so strict mode would produce false misses.
          ccache --set-config=sloppiness=file_stat_matches,include_file_mtime,include_file_ctime,time_macros,locale

      - name: Install ESP-IDF (skipped on cache hit)
        run: |
          # Marker file is written only after a complete install. A cache
          # restore can come back partially extracted, and git clone refuses
          # to write into a non-empty dir - so wipe and reinstall instead.
          MARKER="$IDF_PATH/.install-complete"
          if [ -f "$MARKER" ] && [ -x "$IDF_PATH/export.sh" ]; then
            echo "Toolchain restored from cache, skipping download."
          else
            if [ -e "$IDF_PATH" ]; then
              echo "Toolchain cache incomplete/stale - removing $IDF_PATH"
              sudo rm -rf "$IDF_PATH"
            fi
            sudo mkdir -p "$IDF_PATH"
            sudo chown -R "$(id -u):$(id -g)" "$IDF_PATH"
            git clone -b "$IDF_VERSION" --depth 1 --recursive \
              https://github.com/espressif/esp-idf.git "$IDF_PATH"
            cd "$IDF_PATH"
            ./install.sh esp32,esp32s3
            touch "$MARKER"
          fi

      - name: Export IDF environment
        run: echo "IDF_PATH=$IDF_PATH" >> $GITHUB_ENV

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          # set-target wipes build/ and regenerates the whole config, so
          # only run it when the build dir was not restored from cache.
          if [ "${{ steps.build-state.outputs.restored }}" != "true" ] || [ ! -f build/build.ninja ]; then
            idf.py set-target $IDF_TARGET
          fi
          idf.py build

      # Must run AFTER Build, otherwise it would archive an empty/near-empty
      # build dir. Only saved when the primary key was new.
      - name: Save build artifacts
        uses: actions/cache/save@v4
        if: steps.build-cache.outputs.cache-matched-key == ''
        with:
          path: build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: ccache stats
        if: always()
        run: ccache -s || echo "ccache not available on this runner"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            build/*.bin
            build/*.elf
            build/partition_table/*.bin
            build/bootloader/bootloader.bin
          retention-days: 14